<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b67d1" />
  <title>Hoppy birthday, Rou!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #092f5c;
      --muted: #4b6890;
      --blue-950: #062f68;
      --blue-900: #074a9e;
      --blue-800: #0b67d1;
      --blue-700: #2485ed;
      --blue-100: #e8f3ff;
      --blue-50: #f4f9ff;
      --cream: #fffdf6;
      --yellow: #ffd749;
      --yellow-soft: #fff5c6;
      --coral: #fb7f69;
      --lavender: #aa9cf5;
      --mint: #83dbc4;
      --border: rgba(8, 75, 155, .13);
      --shadow: 0 18px 50px rgba(16, 74, 145, .13);
      --shadow-sm: 0 8px 24px rgba(16, 74, 145, .1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 3%, rgba(255, 215, 73, .32) 0 5px, transparent 6px),
        radial-gradient(circle at 90% 18%, rgba(170, 156, 245, .2) 0 8px, transparent 9px),
        linear-gradient(180deg, #f8fbff 0%, #eef7ff 53%, #f7fbff 100%);
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    button, input { font: inherit; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    button { cursor: pointer; }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(36, 133, 237, .35);
      outline-offset: 3px;
    }

    .app-shell {
      max-width: 1380px;
      margin: 0 auto;
      padding: 22px 28px 44px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 2px solid var(--blue-800);
      border-radius: 15px 15px 15px 5px;
      background: var(--yellow);
      transform: rotate(-7deg);
      box-shadow: 4px 4px 0 var(--blue-800);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: '';
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--ink);
      top: 17px;
    }

    .brand-mark::before { left: 12px; }
    .brand-mark::after { right: 12px; }

    .brand-name {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      letter-spacing: -.02em;
      font-size: 18px;
    }

    .brand-name span { color: var(--blue-800); }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .pill.blue {
      color: var(--blue-900);
      background: var(--blue-100);
    }

    .pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #32c78d;
      box-shadow: 0 0 0 4px rgba(50,199,141,.14);
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 28px;
      align-items: center;
      min-height: 405px;
      padding: 54px 60px;
      border-radius: 32px;
      color: white;
      background: linear-gradient(118deg, #064b9f 0%, #0d70db 60%, #38a4f6 100%);
      box-shadow: var(--shadow);
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 310px;
      height: 310px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%;
      right: -80px;
      top: -120px;
      box-shadow:
        0 0 0 25px rgba(255,255,255,.04),
        0 0 0 55px rgba(255,255,255,.04),
        0 0 0 85px rgba(255,255,255,.04);
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: auto 0 0;
      height: 45px;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,.12) 12%,
        transparent 12% 25%,
        rgba(255,255,255,.12) 25% 37%,
        transparent 37% 50%,
        rgba(255,255,255,.12) 50% 62%,
        transparent 62% 75%,
        rgba(255,255,255,.12) 75% 87%,
        transparent 87%
      );
      opacity: .55;
    }

    .hero-copy,
    .hero-art {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 14px;
      color: #d5edff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: '✦';
      color: var(--yellow);
      font-size: 16px;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      max-width: 680px;
      margin-bottom: 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(42px, 5vw, 72px);
      line-height: .98;
      letter-spacing: -.045em;
      font-weight: 600;
    }

    h1 em {
      color: var(--yellow);
      font-style: normal;
    }

    .hero-copy > p {
      max-width: 470px;
      margin-bottom: 26px;
      color: #e7f4ff;
      font-size: 15px;
      line-height: 1.65;
    }

    .hero-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 44px;
      padding: 11px 17px;
      border: 0;
      border-radius: 14px;
      color: var(--ink);
      background: white;
      font-weight: 800;
      font-size: 13px;
      transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;
      box-shadow: 0 6px 0 rgba(3, 42, 91, .18);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(3, 42, 91, .2);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 3px 0 rgba(3, 42, 91, .2);
    }

    .btn.primary {
      background: var(--yellow);
      color: var(--blue-950);
    }

    .btn.ghost {
      color: white;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.28);
      box-shadow: none;
    }

    .btn.ghost:hover {
      background: rgba(255,255,255,.2);
    }

    .hero-art {
      min-height: 280px;
      display: grid;
      place-items: center;
    }

    .bunny-stage {
      position: relative;
      width: min(330px, 90%);
      aspect-ratio: 1;
    }

    .bunny-halo {
      position: absolute;
      inset: 5% 4% 7%;
      border-radius: 50%;
      background: rgba(255,255,255,.13);
    }

    .bunny-shadow {
      position: absolute;
      left: 15%;
      right: 13%;
      bottom: 7%;
      height: 25px;
      border-radius: 50%;
      background: rgba(2, 50, 110, .27);
      filter: blur(4px);
    }

    .bunny {
      position: absolute;
      left: 23%;
      bottom: 17%;
      width: 53%;
      height: 57%;
      border-radius: 47% 47% 43% 43%;
      background: var(--cream);
      border: 3px solid var(--ink);
      box-shadow: 9px 7px 0 rgba(2, 48, 106, .16);
    }

    .bunny::before,
    .bunny::after {
      content: '';
      position: absolute;
      top: -47%;
      width: 29%;
      height: 62%;
      border-radius: 55% 55% 37% 37%;
      background: var(--cream);
      border: 3px solid var(--ink);
      z-index: -1;
    }

    .bunny::before {
      left: 9%;
      transform: rotate(-9deg);
    }

    .bunny::after {
      right: 9%;
      transform: rotate(9deg);
    }

    .bunny-face::before,
    .bunny-face::after {
      content: '';
      position: absolute;
      top: 42%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink);
    }

    .bunny-face::before { left: 27%; }
    .bunny-face::after { right: 27%; }

    .bunny-nose {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 10px;
      height: 7px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: var(--coral);
    }

    .bunny-muzzle {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 28px;
      height: 13px;
      transform: translateX(-50%);
      border-bottom: 2px solid var(--ink);
      border-radius: 50%;
    }

    .bunny-bow {
      position: absolute;
      right: 12%;
      top: 20%;
      z-index: 2;
    }

    .bunny-bow::before,
    .bunny-bow::after {
      content: '';
      position: absolute;
      width: 27px;
      height: 20px;
      background: var(--coral);
      border: 2px solid var(--ink);
    }

    .bunny-bow::before {
      border-radius: 90% 18% 60% 18%;
      transform: rotate(26deg);
      right: 1px;
    }

    .bunny-bow::after {
      border-radius: 18% 90% 18% 60%;
      transform: rotate(-26deg);
      right: 19px;
    }

    .bunny-bow-dot {
      position: absolute;
      z-index: 2;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--yellow);
      border: 2px solid var(--ink);
      right: 20px;
      top: 6px;
    }

    .floating-spark {
      position: absolute;
      font-size: 30px;
      animation: float 3.4s ease-in-out infinite;
    }

    .spark-one {
      left: 3%;
      top: 23%;
      color: var(--yellow);
    }

    .spark-two {
      right: 8%;
      bottom: 22%;
      color: #d2c9ff;
      animation-delay: -.8s;
      font-size: 23px;
    }

    .spark-three {
      left: 11%;
      bottom: 11%;
      color: #84e0d0;
      animation-delay: -1.6s;
      font-size: 19px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin: 44px 3px 17px;
    }

    .section-kicker {
      margin-bottom: 6px;
      color: var(--blue-800);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h2 {
      margin-bottom: 0;
      font-family: 'Fredoka', sans-serif;
      font-size: 30px;
      letter-spacing: -.035em;
      font-weight: 600;
    }

    .section-note {
      max-width: 340px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      text-align: right;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.04fr .96fr;
      gap: 20px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(255,255,255,.82);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(12px);
    }

    .card-pad { padding: 23px; }

    .message-card {
      min-height: 436px;
    }

    .card-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-family: 'Fredoka', sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .icon-box {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border-radius: 12px;
      color: var(--blue-900);
      background: var(--blue-100);
      font-size: 18px;
    }

    .mini-tag {
      border-radius: 999px;
      padding: 6px 10px;
      color: #7d4e00;
      background: var(--yellow-soft);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      color: var(--ink);
      font-size: 14px;
    }

    input:focus { outline: none; }

    .message-preview {
      position: relative;
      overflow: hidden;
      margin-top: 17px;
      padding: 20px 22px;
      border-radius: 18px;
      background: #edf6ff;
    }

    .message-preview::after {
      content: '✦';
      position: absolute;
      right: 19px;
      bottom: 8px;
      color: var(--yellow);
      font-size: 27px;
      transform: rotate(12deg);
    }

    .message-preview .to-line {
      margin-bottom: 5px;
      color: var(--blue-800);
      font-size: 12px;
      font-weight: 800;
    }

    .message-preview .script {
      max-width: 80%;
      margin: 0;
      color: var(--blue-950);
      font-family: 'Caveat', cursive;
      font-size: 29px;
      font-weight: 600;
      line-height: 1.06;
    }

    .message-preview .signature {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .save-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 17px;
    }

    .save-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #3c7a64;
      font-size: 11px;
      font-weight: 700;
    }

    .save-status span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #42c294;
    }

    .btn-small {
      min-height: 36px;
      padding: 8px 13px;
      border-radius: 11px;
      font-size: 12px;
      box-shadow: none;
    }

    .candle-card {
      position: relative;
      overflow: hidden;
      min-height: 436px;
      background: var(--blue-950);
      color: white;
      border-color: rgba(255,255,255,.08);
    }

    .candle-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: .24;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 16px 16px;
      mask-image: linear-gradient(135deg, transparent 10%, black 70%);
    }

    .candle-inner {
      position: relative;
      z-index: 1;
      padding: 23px;
    }

    .candle-card .card-title { color: white; }

    .candle-card .icon-box {
      color: var(--blue-950);
      background: var(--yellow);
    }

    .candle-instruction {
      max-width: 325px;
      margin: 24px auto 0;
      color: #c6e1ff;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .cake-zone {
      position: relative;
      display: flex;
      justify-content: center;
      height: 207px;
      margin-top: 6px;
    }

    .cake-plate {
      position: absolute;
      bottom: 5px;
      width: 220px;
      height: 26px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: #e6f2ff;
      box-shadow: 0 5px 0 rgba(0,0,0,.16);
    }

    .cake {
      position: absolute;
      bottom: 20px;
      width: 152px;
      height: 91px;
      border: 3px solid var(--ink);
      border-radius: 18px 18px 13px 13px;
      background: #83c5fb;
      box-shadow: inset 0 -15px 0 rgba(255,255,255,.24);
    }

    .cake::before {
      content: '';
      position: absolute;
      top: -17px;
      left: -4px;
      width: 154px;
      height: 31px;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: #fff9ee;
    }

    .cake::after {
      content: '✦  ✦  ✦';
      position: absolute;
      left: 20px;
      top: 36px;
      color: white;
      font-size: 14px;
      letter-spacing: 12px;
    }

    .candle {
      position: absolute;
      bottom: 109px;
      width: 13px;
      height: 51px;
      border: 2px solid var(--ink);
      border-radius: 6px 6px 3px 3px;
      background: repeating-linear-gradient(
        135deg,
        #ff92a9 0 7px,
        #fff8ee 7px 12px
      );
      z-index: 2;
      transition: opacity .35s, transform .35s;
    }

    .candle.c1 { margin-left: -74px; }
    .candle.c2 { margin-left: 0; }
    .candle.c3 { margin-left: 74px; }

    .flame {
      position: absolute;
      left: 50%;
      top: -27px;
      width: 17px;
      height: 25px;
      transform: translateX(-50%);
      border: 2px solid var(--ink);
      border-radius: 70% 30% 70% 30%;
      background: var(--yellow);
      box-shadow: 0 0 20px rgba(255,215,73,.75);
      animation: flicker .75s ease-in-out infinite alternate;
    }

    .blown .candle {
      opacity: .45;
      transform: translateY(5px) rotate(4deg);
    }

    .blown .flame {
      opacity: 0;
      transform: translateX(-50%) scale(.15);
    }

    .blown .smoke {
      opacity: 1;
      transform: translate(-50%, -15px) scale(1);
    }

    .smoke {
      position: absolute;
      left: 50%;
      top: -38px;
      width: 17px;
      height: 30px;
      border-left: 3px solid rgba(214,236,255,.7);
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%, 0) scale(.4);
      transition: .45s;
    }

    .candle-action {
      display: flex;
      justify-content: center;
      margin-top: 2px;
    }

    .candle-action .btn { background: var(--yellow); }

    .surprise {
      display: none;
      margin-top: 15px;
      padding: 14px 16px;
      border: 1px solid rgba(255,215,73,.3);
      border-radius: 15px;
      color: #fff5c6;
      background: rgba(255,215,73,.1);
      text-align: center;
      animation: pop .4s ease both;
    }

    .surprise.visible { display: block; }

    .surprise strong {
      display: block;
      margin-bottom: 4px;
      color: var(--yellow);
      font-family: 'Fredoka', sans-serif;
      font-size: 17px;
    }

    .surprise span {
      font-family: 'Caveat', cursive;
      font-size: 19px;
    }
    .lower-grid {
      display: grid;
      grid-template-columns: 1.12fr .88fr;
      gap: 20px;
      margin-top: 20px;
    }

    .player-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 18px;
      min-height: 116px;
      padding: 20px 23px;
      background: #fffdf6;
    }

    .album-art {
      position: relative;
      display: grid;
      place-items: center;
      width: 69px;
      height: 69px;
      border-radius: 18px;
      border: 2px solid var(--ink);
      background: var(--yellow);
      box-shadow: 4px 4px 0 var(--blue-800);
    }

    .album-art::before {
      content: '♫';
      color: var(--blue-950);
      font-family: Georgia, serif;
      font-size: 29px;
    }

    .album-art::after {
      content: '✦';
      position: absolute;
      top: -9px;
      right: -7px;
      color: var(--coral);
      font-size: 18px;
    }

    .player-copy h3 {
      margin-bottom: 4px;
      font-family: 'Fredoka', sans-serif;
      font-size: 18px;
    }

    .track-artist {
      color: var(--blue-800);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .player-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .song-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      color: var(--blue-800);
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
    }

    .song-link:hover {
      color: var(--blue-900);
      text-decoration: underline;
    }

    .track-progress {
      position: relative;
      width: 100%;
      height: 5px;
      margin-top: 13px;
      border-radius: 999px;
      background: #dfeaf5;
      overflow: hidden;
    }

    .track-progress span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--blue-700);
      transition: width 1s linear;
    }

    .player-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .round-btn {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      color: white;
      background: var(--blue-800);
      font-size: 16px;
      box-shadow: 0 5px 0 #06488f;
    }

    .round-btn:hover {
      transform: translateY(-2px);
    }

    .volume {
      width: 76px;
      accent-color: var(--blue-800);
    }

    .tiny-caption {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .gift-card {
      position: relative;
      overflow: hidden;
      min-height: 116px;
      padding: 20px 23px;
      color: white;
      background: linear-gradient(135deg, #ec806c 0%, #ee9a67 100%);
      border: 0;
    }

    .gift-card::after {
      content: '✦';
      position: absolute;
      right: 16px;
      top: 7px;
      color: rgba(255,255,255,.65);
      font-size: 25px;
    }

    .gift-card .card-title { color: white; }

    .gift-card .icon-box {
      color: #c5624f;
      background: white;
    }

    .gift-body {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 11px;
    }

    .gift-box {
      position: relative;
      flex: 0 0 auto;
      width: 68px;
      height: 55px;
      border: 2px solid var(--ink);
      border-radius: 7px;
      background: var(--yellow);
      box-shadow: 4px 4px 0 rgba(83,42,40,.14);
      transition: transform .4s;
    }

    .gift-box::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 26px;
      width: 11px;
      background: var(--coral);
      border-inline: 2px solid var(--ink);
    }

    .gift-box::after {
      content: '';
      position: absolute;
      left: 10px;
      top: -16px;
      width: 43px;
      height: 18px;
      border: 2px solid var(--ink);
      border-radius: 5px;
      background: var(--yellow);
    }

    .gift-card.open .gift-box {
      transform: translateY(28px) rotate(-4deg);
    }

    .gift-text { min-width: 0; }

    .gift-text p {
      margin: 0 0 8px;
      color: #fff3ee;
      font-size: 12px;
    }

    .gift-card .btn {
      min-height: 34px;
      padding: 8px 12px;
      color: #9b4536;
      font-size: 11px;
      box-shadow: none;
    }

    .gift-code {
      display: none;
      margin-top: 9px;
      font-family: 'Caveat', cursive;
      font-size: 21px;
      color: var(--yellow-soft);
    }

    .gift-code.visible {
      display: block;
      animation: pop .35s ease both;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 30px 3px 0;
      color: var(--muted);
      font-size: 11px;
    }

    footer strong { color: var(--blue-800); }

    .footer-bunny { font-size: 19px; }

    #confetti-layer,
    #fireworks {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      top: -22px;
      width: 9px;
      height: 16px;
      border-radius: 2px;
      opacity: 0;
      animation: fall var(--fall) cubic-bezier(.15,.72,.35,1) var(--delay) forwards;
    }

    #fireworks {
      opacity: 0;
      transition: opacity .3s;
    }

    #fireworks.show { opacity: 1; }

    .toast {
      position: fixed;
      z-index: 80;
      left: 50%;
      bottom: 24px;
      max-width: calc(100vw - 40px);
      padding: 12px 17px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      color: white;
      background: var(--blue-950);
      box-shadow: var(--shadow);
      font-size: 12px;
      font-weight: 700;
      transform: translate(-50%, 90px);
      transition: transform .35s ease;
    }

    .toast.show {
      transform: translate(-50%, 0);
    }

    @keyframes fall {
      0% {
        opacity: 1;
        transform: translate3d(0, -20px, 0) rotate(0deg);
      }

      100% {
        opacity: 0;
        transform: translate3d(var(--drift), 108vh, 0) rotate(var(--spin));
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-8deg);
      }

      50% {
        transform: translateY(-11px) rotate(9deg);
      }
    }

    @keyframes flicker {
      from {
        transform: translateX(-50%) rotate(-6deg) scale(.96);
      }

      to {
        transform: translateX(-50%) rotate(7deg) scale(1.05);
      }
    }

    @keyframes pop {
      0% {
        opacity: 0;
        transform: scale(.9) translateY(7px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @media (max-width: 1000px) {
      .hero {
        padding: 42px 38px;
        grid-template-columns: 1.1fr .9fr;
      }

      .main-grid,
      .lower-grid {
        grid-template-columns: 1fr;
      }

      .candle-card {
        min-height: auto;
      }

      .section-note {
        text-align: left;
      }
    }

    @media (max-width: 690px) {
      .app-shell {
        padding: 14px 15px 32px;
      }

      .topbar {
        margin-bottom: 15px;
      }

      .top-actions .pill {
        display: none;
      }

      .hero {
        display: block;
        min-height: auto;
        padding: 36px 24px 20px;
        border-radius: 24px;
      }

      h1 { font-size: 46px; }

      .hero-art {
        min-height: 245px;
        margin-top: 18px;
      }

      .section-head {
        display: block;
        margin-top: 31px;
      }

      .section-note {
        margin-top: 8px;
      }

      .card-pad,
      .candle-inner {
        padding: 18px;
      }

      .message-card {
        min-height: 0;
      }

      .player-card {
        grid-template-columns: auto 1fr;
        gap: 12px;
      }

      .player-actions {
        grid-column: 1 / -1;
        justify-content: space-between;
      }

      .volume {
        flex: 1;
      }

      footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
  <script>
    const $ = (selector) => document.querySelector(selector);

    const confettiColors = [
      '#ffd749',
      '#fb7f69',
      '#a89cf3',
      '#83dbc4',
      '#ffffff',
      '#2485ed'
    ];

    let toastTimer;

    function showToast(message) {
      const toast = $('#toast');

      toast.textContent = message;
      toast.classList.add('show');

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2400);
    }

    function launchConfetti(count = 70) {
      const layer = $('#confetti-layer');

      layer.replaceChildren();

      for (let i = 0; i < count; i++) {
        const piece = document.createElement('i');

        piece.className = 'confetti';
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = confettiColors[i % confettiColors.length];
        piece.style.setProperty('--fall', `${2.8 + Math.random() * 2.6}s`);
        piece.style.setProperty('--delay', `${Math.random() * .75}s`);
        piece.style.setProperty('--drift', `${-130 + Math.random() * 260}px`);
        piece.style.setProperty('--spin', `${260 + Math.random() * 720}deg`);
        piece.style.width = `${6 + Math.random() * 7}px`;
        piece.style.height = `${9 + Math.random() * 10}px`;

        layer.appendChild(piece);
      }

      setTimeout(() => {
        layer.replaceChildren();
      }, 6500);
    }

    let audioContext;
    let melodyTimer;
    let progressTimer;
    let progressSeconds = 0;
    let noteIndex = 0;
    let isPlaying = false;
    let startedOnce = false;

    const tune = [
      261.63,
      329.63,
      392,
      523.25,
      392,
      329.63,
      293.66,
      392,
      523.25,
      659.25,
      523.25,
      392
    ];

    function playNote(frequency, duration = .27) {
      if (!audioContext) return;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = 'triangle';
      oscillator.frequency.value = frequency;

      gain.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        Math.max(.0001, Number($('#volume').value) * .13),
        audioContext.currentTime + .02
      );

      gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioContext.currentTime + duration
      );

      oscillator.connect(gain).connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration + .02);
    }

    async function startMusic() {
      audioContext ||= new (
        window.AudioContext || window.webkitAudioContext
      )();

      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      if (isPlaying) return;

      isPlaying = true;
      startedOnce = true;

      $('#music-toggle').textContent = 'Ⅱ';
      $('#music-toggle').setAttribute(
        'aria-label',
        'Pause birthday preview'
      );

      $('#music-status').textContent =
        'preview chime · official track linked above';

      melodyTimer = setInterval(() => {
        playNote(tune[noteIndex % tune.length]);
        noteIndex++;
      }, 310);

      progressTimer = setInterval(() => {
        progressSeconds = (progressSeconds + 1) % 73;

        $('#progress-fill').style.width =
          `${(progressSeconds / 72) * 100}%`;

        $('.track-progress').setAttribute(
          'aria-valuenow',
          progressSeconds
        );

        $('#timer').textContent =
          `${Math.floor(progressSeconds / 60)}:${String(
            progressSeconds % 60
          ).padStart(2, '0')} / 1:12`;
      }, 1000);

      playNote(tune[noteIndex % tune.length]);
      noteIndex++;
    }

    function stopMusic() {
      clearInterval(melodyTimer);
      clearInterval(progressTimer);

      isPlaying = false;

      $('#music-toggle').textContent = '▶';

      $('#music-toggle').setAttribute(
        'aria-label',
        'Play birthday preview'
      );

      $('#music-status').textContent = startedOnce
        ? 'paused · open Someday when you’re ready'
        : 'official track · ready to open';
    }

    function toggleMusic() {
      if (isPlaying) {
        stopMusic();
      } else {
        startMusic().catch(() => {
          showToast('Tap play to start the birthday tune ✨');
        });
      }
    }

    const fireworksCanvas = $('#fireworks');
    const fireworkCtx = fireworksCanvas.getContext('2d');

    let fireworks = [];
    let fireworksFrame;

    function resizeCanvas() {
      fireworksCanvas.width = innerWidth * devicePixelRatio;
      fireworksCanvas.height = innerHeight * devicePixelRatio;

      fireworkCtx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
      );
    }

    function triggerFireworks() {
      resizeCanvas();

      fireworksCanvas.classList.add('show');
      fireworks = [];

      const colors = [
        '#ffd749',
        '#fb7f69',
        '#b4a9ff',
        '#83dbc4',
        '#ffffff'
      ];

      for (let burst = 0; burst < 5; burst++) {
        const x = innerWidth * (.16 + Math.random() * .68);
        const y = innerHeight * (.18 + Math.random() * .35);
        const color = colors[burst];

        for (let i = 0; i < 34; i++) {
          const angle = (Math.PI * 2 * i) / 34;
          const speed = 1.3 + Math.random() * 2.7;

          fireworks.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            color
          });
        }
      }

      cancelAnimationFrame(fireworksFrame);
      drawFireworks();

      setTimeout(() => {
        fireworksCanvas.classList.remove('show');
        cancelAnimationFrame(fireworksFrame);
        fireworkCtx.clearRect(
          0,
          0,
          innerWidth,
          innerHeight
        );
      }, 2700);
    }

    function drawFireworks() {
      fireworkCtx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
      );

      fireworks = fireworks.filter((particle) => {
        return particle.life > 0;
      });

      fireworks.forEach((particle) => {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.vy += .018;
        particle.life -= .012;

        fireworkCtx.globalAlpha = Math.max(0, particle.life);
        fireworkCtx.fillStyle = particle.color;

        fireworkCtx.beginPath();
        fireworkCtx.arc(
          particle.x,
          particle.y,
          2.3,
          0,
          Math.PI * 2
        );
        fireworkCtx.fill();
      });

      fireworkCtx.globalAlpha = 1;

      if (fireworks.length) {
        fireworksFrame = requestAnimationFrame(drawFireworks);
      }
    }

    launchConfetti();

    startMusic().catch(() => {});

    window.addEventListener('resize', resizeCanvas);

    ['pointerdown', 'keydown'].forEach((eventName) => {
      window.addEventListener(
        eventName,
        () => {
          if (!isPlaying && !startedOnce) {
            startMusic().catch(() => {});
          }
        },
        { once: true }
      );
    });

    $('#replay-confetti').addEventListener('click', () => {
      launchConfetti();
      showToast('More confetti for the birthday star ✨');
    });

    $('#hero-celebrate').addEventListener('click', () => {
      launchConfetti(105);
      triggerFireworks();
      startMusic().catch(() => {});
      showToast('The party is officially on!');
    });

    $('#blow-candles').addEventListener('click', () => {
      const card = $('#candle-card');
      const surprise = $('#surprise');

      card.classList.add('blown');
      surprise.classList.add('visible');

      $('#blow-candles').textContent = 'Wish made! ✨';
      $('#blow-candles').disabled = true;

      triggerFireworks();
      launchConfetti(48);

      showToast('Your wish is safe with us ✨');
    });

    $('#music-toggle').addEventListener('click', toggleMusic);

    $('#volume').addEventListener('input', () => {
      if (isPlaying) {
        playNote(
          tune[(noteIndex + 2) % tune.length],
          .1
        );
      }
    });

    $('#unwrap').addEventListener('click', () => {
      $('#gift-card').classList.add('open');
      $('#gift-code').classList.add('visible');
      $('#unwrap').textContent = 'Gift opened ✓';
      $('#unwrap').disabled = true;

      triggerFireworks();
      showToast('A little treat, just for you 🎁');
    });

    $('#copy-note').addEventListener('click', async () => {
      const text = `Dear Rou,

Happy Birthday Rou, sana swertehin ka sa mga pulls mo HAHAH, nandito ako palagi para makinig sa mga yaps mo ;p, wag na masyado mag puyat ha HAHAH, I'll always cheer for you.

With love, Yelo ♡`;

      try {
        await navigator.clipboard.writeText(text);
        showToast('Birthday note copied to clipboard');
      } catch {
        showToast('Your note is ready to share ♡');
      }
    });
  </script>
</body>
</html>
